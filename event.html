<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>CODE DUNES — Start Main Event | Spardha 2k26</title>
  
  <meta name="description" content="Event Briefing and Launch Arena for CODE DUNES — Spardha 2k26.">
  <meta name="theme-color" content="#0d0906">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/code-dunes-poster.jpg">

  <!-- Google Fonts: Bebas Neue, Cinzel, Montserrat & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700;800&family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="event.css">
</head>
<body>

  <!-- Full-screen Hero Atmosphere with Ambient Canvas -->
  <main class="event-hero" role="main">
    
    <!-- Moving sand particles canvas -->
    <canvas id="sand-canvas" aria-hidden="true"></canvas>
    
    <!-- Cinematic Dark Overlay -->
    <div class="event-overlay" aria-hidden="true"></div>

    <!-- Persistent Top Header -->
    <header class="event-header">
      <div class="fest-pill">
        <span class="fest-prefix">ACM VVITU PRESENTS</span>
        <span class="meta-dot" aria-hidden="true">◆</span>
        <span>SPARDHA 2K26 — UNCHARTED</span>
      </div>
    </header>

    <div class="lobby-wrapper start-screen">
      <section class="start-panel" aria-labelledby="event-title">
        <p class="start-eyebrow">SPARDHA 2K26</p>
        <h1 class="start-title" id="event-title">CODE DUNES</h1>
        <p class="start-description">Enter the arena and put your coding skills to the test.</p>

        <div class="action-launch-area">
          <a href="https://www.codechef.com/skill-test/VVITHACK" class="btn-main-event" id="btn-start-main-event" aria-label="Start Main Event Arena" target="_blank" rel="noopener noreferrer">
            <span class="btn-pulse-ring" aria-hidden="true"></span>
            <span class="btn-glow" aria-hidden="true"></span>
            <span class="btn-text">START MAIN EVENT</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </a>
        </div>
        <p class="launch-note">90 minutes in the arena.</p>
      </section>
    </div>

    <footer class="event-details" role="contentinfo">
      <div class="meta-inner">
        <span class="meta-item">INDIVIDUAL</span>
        <span class="meta-dot" aria-hidden="true">◆</span>
        <span class="meta-item">12 OCT 2026</span>
        <span class="meta-dot" aria-hidden="true">◆</span>
        <span class="meta-item platform">CODE ARENA</span>
      </div>
    </footer>

  </main>


  <script src="event.js"></script>
</body>
</html>
